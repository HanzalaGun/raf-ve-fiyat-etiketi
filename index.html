<style>
:root{
  --sc-canvas:#0B0B0D; --sc-surface:#131317;
  --sc-ink:#ECECEE;    --sc-ink-soft:#8B8B96;
  --sc-accent:#FF5A1F; --sc-accent-ink:#0B0B0D;
  --sc-hata:#e5484d;
  --sc-font-display: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --sc-font-text: system-ui, -apple-system, "Segoe UI", sans-serif;
  --hairline: color-mix(in srgb, var(--sc-ink) 13%, transparent);
  --hairline-2: color-mix(in srgb, var(--sc-ink) 22%, transparent);
}
*{box-sizing:border-box}
input,select,textarea{accent-color:var(--sc-accent)}
body{margin:0; background:var(--sc-canvas); color:var(--sc-ink);
  font-family:var(--sc-font-text); font-size:15px; line-height:1.6}
.sayfa{max-width:980px; margin:0 auto; padding:40px 20px 80px}
h1{font-family:var(--sc-font-display); font-size:23px; letter-spacing:-.01em; margin:0 0 10px}
.ozet{color:var(--sc-ink-soft); margin:0 0 6px}
.ust-bag{font-family:var(--sc-font-display); font-size:11px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--sc-ink-soft); margin:0 0 20px}
.ust-bag a{color:var(--sc-accent)}
footer{margin-top:34px; padding-top:18px; border-top:1px solid var(--hairline);
  font-size:12px; color:var(--sc-ink-soft)}
footer a{color:var(--sc-accent)}
.diller{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 26px}
.diller button{padding:4px 11px; border:1px solid var(--hairline); background:none;
  color:var(--sc-ink-soft); font-family:var(--sc-font-display); font-size:11px;
  letter-spacing:.05em; cursor:pointer; border-radius:999px;
  transition:color .18s, border-color .18s, background .18s}
.diller button:hover{color:var(--sc-ink); border-color:var(--sc-ink-soft)}
.diller button[aria-pressed="true"]{color:var(--sc-accent-ink); background:var(--sc-accent);
  border-color:var(--sc-accent)}

.arac{border:1px solid var(--hairline); background:var(--sc-surface); padding:16px; margin:24px 0}
.arac input,.arac select{width:100%; background:var(--sc-canvas); border:1px solid var(--hairline);
  color:var(--sc-ink); padding:8px 10px; font:inherit; font-size:14px}
.arac input:focus,.arac select:focus{outline:none; border-color:var(--sc-accent)}
.arac__alanlar{display:flex; flex-wrap:wrap; gap:12px; margin-top:18px}
.arac__alanlar label{flex:1 1 180px; font-family:var(--sc-font-display); font-size:11px;
  color:var(--sc-ink-soft); text-transform:uppercase; letter-spacing:.06em}
.arac__alanlar label span{display:block}
.arac__alanlar input,.arac__alanlar select{margin-top:6px}
.arac__onay{display:flex; align-items:center; gap:7px; flex:0 0 auto; align-self:end;
  padding-bottom:9px; text-transform:none; letter-spacing:0; font-size:13px}
.arac__onay input{width:auto; margin:0}
.arac__blok{display:block; font-family:var(--sc-font-display); font-size:11px;
  letter-spacing:.05em; color:var(--sc-ink-soft); margin-bottom:14px}
.arac__blok b{color:var(--sc-ink)}
.arac__blok textarea{width:100%; margin-top:8px; background:var(--sc-canvas);
  border:1px solid var(--hairline); color:var(--sc-ink); padding:10px; font:inherit;
  font-family:ui-monospace,monospace; font-size:13px; letter-spacing:0}
.arac__not{margin-top:10px; font-size:12px; color:var(--sc-ink-soft)}
ul.arac__uyari{margin:12px 0 0 18px; padding:0}
ul.arac__uyari li{font-size:13px; color:var(--sc-hata)}
p.arac__uyari{margin-top:12px; font-size:13px; color:var(--sc-hata)}
.arac__dugmeler{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; align-items:center}
.arac__dugmeler button{background:none; border:1px solid var(--hairline-2); color:var(--sc-ink);
  padding:9px 14px; font:inherit; font-size:12px; cursor:pointer;
  font-family:var(--sc-font-display); letter-spacing:.04em}
.arac__dugmeler button:hover:not(:disabled){border-color:var(--sc-accent); color:var(--sc-accent)}
.arac__dugmeler button:disabled{opacity:.4; cursor:default}
.arac__sayi{font-family:var(--sc-font-display); font-size:12px; color:var(--sc-ink-soft);
  margin-inline-end:auto}
.arac__renk{display:flex; gap:8px; align-items:center; margin-top:6px}
.arac__renk input[type=color]{width:38px; height:34px; padding:2px; flex:0 0 auto; cursor:pointer}
.arac__kontrast{font-family:var(--sc-font-display); font-size:11px; margin-top:8px;
  color:var(--sc-ink-soft); text-transform:none; letter-spacing:0}
.arac__kontrast[data-dusuk="1"]{color:var(--sc-hata)}
/* Ürün listesi ve ölçüler soldan sağa: fiyat ve barkod rakamları RTL'de ters okunuyor. */
[dir="rtl"] #ham{direction:ltr; text-align:left}
[hidden]{display:none !important}

/* ---------- etiketler ----------
   Ölçüler --et-* değişkenlerinden; kap da etiket genişliğine sabitleniyor —
   serbest bırakılınca Chrome sayfayı sığdırmak için her şeyi küçültüyor. */
.raf-kutu{
  display:grid; grid-template-columns:repeat(var(--et-sutun), var(--et-en));
  width:calc(var(--et-en) * var(--et-sutun));
  margin-top:18px; max-height:520px; overflow:auto; direction:ltr;
}
.raf-etiket{
  width:var(--et-en); height:var(--et-boy);
  border:1px dashed color-mix(in srgb, var(--et-murekkep) 30%, transparent);
  padding:2.5mm 3mm; overflow:hidden;
  display:flex; flex-direction:column; justify-content:center; gap:0.6mm;
  background:var(--et-zemin, #fff); color:var(--et-murekkep, #111);
  font-family:var(--sc-font-text);
  /* Tarayıcılar baskıda zemin rengini ATIYOR. Sarı etiket sarı basılmazsa
     aracın renk seçimi hiçbir işe yaramaz, o yüzden açıkça istiyoruz. */
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.raf-etiket__ad{font-size:2.6mm; line-height:1.25; font-weight:600;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.raf-etiket__fiyat{font-size:7mm; font-weight:800; line-height:1; letter-spacing:-.02em}
.raf-etiket__eski{font-size:3mm; text-decoration:line-through; opacity:.65}
.raf-etiket__yuzde{align-self:flex-start; font-size:3mm; font-weight:800;
  background:var(--et-rozet); color:var(--et-rozet-yazi); padding:0.4mm 1.4mm;
  -webkit-print-color-adjust:exact; print-color-adjust:exact}
.raf-etiket__birim{font-size:2.7mm; opacity:.75}
.raf-etiket__alt{font-size:2.2mm; opacity:.6; margin-top:auto}

/* Düzenler yalnız VURGUYU değiştiriyor, ölçüyü değil: aynı kâğıda basılacak. */
.raf-etiket[data-duzen="birim"] .raf-etiket__fiyat{font-size:4.4mm}
.raf-etiket[data-duzen="birim"] .raf-etiket__birim{font-size:5.4mm; font-weight:800; opacity:1}
.raf-etiket[data-duzen="sade"] .raf-etiket__birim,
.raf-etiket[data-duzen="sade"] .raf-etiket__alt{display:none}
.raf-etiket[data-duzen="sade"] .raf-etiket__fiyat{font-size:8mm}
.raf-etiket[data-duzen="fiyat"] .raf-etiket__eski,
.raf-etiket[data-duzen="fiyat"] .raf-etiket__yuzde,
.raf-etiket[data-duzen="birim"] .raf-etiket__yuzde,
.raf-etiket[data-duzen="sade"] .raf-etiket__eski,
.raf-etiket[data-duzen="sade"] .raf-etiket__yuzde{display:none}

/* Baskı: sayfada yalnız etiketler kalsın. Her şey kapanıyor, etiket kutusunun
   ata zinciri :has() ile geri açılıyor — sayfa yapısı değişse de bozulmuyor. */
@media print{
  body *{display:none !important}
  *:has(.baski-alani){display:block !important; border:none !important;
    background:none !important; padding:0 !important; margin:0 !important}
  .baski-alani, .baski-alani *{display:revert !important}
  .baski-alani{display:grid !important; max-height:none !important;
    overflow:visible !important; margin:0 !important}
  .raf-etiket{display:flex !important; border:1px solid #ddd}
  html,body{width:auto !important; min-width:0 !important; margin:0 !important; padding:0 !important}
  @page{size:A4; margin:0}
}
</style>

/** Girilen dili doğrular; tanımadığını Türkçeye düşürür. */
const dilCoz = (istenen) => (DILLER.includes(istenen) ? istenen : 'tr')

/** '{a}' yer tutucularını doldurur. */
const doldur = (kalip, d) =>
  Object.entries(d).reduce((m, [k, v]) => m.replaceAll('{' + k + '}', v), kalip)

/* ---------- ayrıştırma ---------- */

/**
 * Satırı sütunlara böler.
 *
 * Virgül SON çare: Türkçe fiyat "145,90" yazılıyor ve virgülü ayraç saymak
 * fiyatı 145, miktarı 90 yapardı. Satırda sekme, noktalı virgül veya boru
 * varsa ayraç odur; yoksa virgüle düşülür.
 */
const bol = (satir) => {
  const ayrac = /[\t;|]/.test(satir) ? /[\t;|]/ : /,/
  return satir.split(ayrac).map((x) => x.trim())
}

/**
 * Türkçe ondalık ayracını kabul eden sayı okuyucu. Geçersizse `null`.
 *
 * BOŞ DİZGİ ÖNCE ELENİYOR: `Number('')` sıfır döndürüyor ve
 * `Number.isFinite(0)` doğru. Bu eleme olmadan boş bırakılan fiyat sessizce
 * 0 ₺ oluyordu — etikette "0,00 ₺" basılıyor, eksik alan uyarısı da
 * çıkmıyordu. Fiyatı olmayan ürün ile fiyatı sıfır olan ürün aynı şey değil.
 */
const oku = (x) => {
  const ham = String(x ?? '').trim()
  if (!ham) return null
  const n = Number(ham.replace(',', '.'))
  return Number.isFinite(n) ? n : null
}

/** Gram ve mililitre kilo ve litreye çevriliyor: "0,045 ₺/g" kimseye bir şey
    anlatmıyor, "360,00 ₺/kg" anlatıyor. */
const OLCEK = {
  adet: { carpan: 1, goster: 'adet' },
  g: { carpan: 0.001, goster: 'kg' },
  kg: { carpan: 1, goster: 'kg' },
  l: { carpan: 1, goster: 'L' },
  lt: { carpan: 1, goster: 'L' },
  m: { carpan: 1, goster: 'm' },
  ml: { carpan: 0.001, goster: 'L' },
}

const DUZENLER = ['fiyat', 'indirim', 'birim', 'sade']

/* ---------- renk ----------
   Etiket zemini işletmenin seçimi; yazı rengi ölçümle geliyor. Perakendede
   sarı indirim, kırmızı son fırsat demek — renk bilgi taşıyor, süs değil.
   Adları METIN.renkler'de, sırası bu diziyle aynı. */
const RENKLER = ['#ffffff', '#ffe200', '#d81f26', '#0f6b2f', '#f5741f', 'ozel']

/** `#rrggbb` ya da `#rgb` → [r,g,b]. Tanınmayan girdi null. */
const hexOku = (x) => {
  const h = String(x ?? '').trim()
  const uzun = /^#([0-9a-fA-F]{6})$/.exec(h)
  if (uzun) { const n = parseInt(uzun[1], 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255] }
  const kisa = /^#([0-9a-fA-F]{3})$/.exec(h)
  if (kisa) { const [a, b, c] = kisa[1].split(''); return [parseInt(a + a, 16), parseInt(b + b, 16), parseInt(c + c, 16)] }
  return null
}
const kanal = (v) => { const x = v / 255; return x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4 }

/** sRGB bağıl parlaklık (0–1). */
const parlaklik = (renk) => {
  const r = hexOku(renk)
  return r ? 0.2126 * kanal(r[0]) + 0.7152 * kanal(r[1]) + 0.0722 * kanal(r[2]) : null
}

/**
 * WCAG kontrast oranı (1–21).
 *
 * Geçersiz renkte 0 dönüyor, 21 değil: eşik kontrolü `< 4.5` yazıldığı için
 * 0 kapıyı KAPATIYOR. Ters olsaydı çöp girdi kapıyı açardı.
 */
const kontrast = (a, b) => {
  const la = parlaklik(a), lb = parlaklik(b)
  if (la === null || lb === null) return 0
  const [y, d] = la > lb ? [la, lb] : [lb, la]
  return (y + 0.05) / (d + 0.05)
}

/**
 * Yazı rengi: siyah mı beyaz mı — hangisi daha çok kontrast veriyorsa.
 * Parlaklık eşiğiyle karar vermek orta tonlarda yanlış tarafı seçiyor.
 *
 * Karşılaştırılan ve DÖNDÜRÜLEN renk aynı olmak zorunda. Önce karar
 * `#000000`a bakıp `#111111` döndürüyordu; o uyuşmazlık en kötü durumu
 * 4,14'e düşürüyordu (tarama sınaması yakaladı) çünkü `#111111` saf siyahtan
 * daha az kontrast veriyor. Saf siyah hem garantiyi 4,58'e çıkarıyor hem de
 * baskıda gerçekten basılan renk.
 */
const SIYAH = '#000000'
const BEYAZ = '#ffffff'
const murekkep = (zemin) =>
  kontrast(zemin, SIYAH) >= kontrast(zemin, BEYAZ) ? SIYAH : BEYAZ

/**
 * İndirim rozeti. Perakende kırmızısı bilgi taşıyor, mümkünse korunuyor;
 * kırmızı zeminde kaybolduğu için (kontrast 1'e yakın) orada mürekkep
 * rengine dönüyor — o zemine göre tanım gereği kontrastlı.
 */
const rozetRenk = (zemin) => {
  const KIRMIZI = '#c0182b'
  return kontrast(zemin, KIRMIZI) >= 3
    ? { yazi: murekkep(KIRMIZI), zemin: KIRMIZI }
    : { yazi: zemin, zemin: murekkep(zemin) }
}
/** Hazır tabaka ölçüleri — barkod aracıyla aynı kâğıtlar. */
const TABAKA = [
  { g: 70, satir: 8, sutun: 3, y: 37 },
  { g: 105, satir: 8, sutun: 2, y: 37 },
  { g: 52.5, satir: 10, sutun: 4, y: 29.7 },
  { g: 105, satir: 4, sutun: 2, y: 74 },
]
const ONIZLEME = 20
const TAVAN = 400

const ayikla = (ham) =>
  ham.split('\n').map((s) => s.trim()).filter(Boolean).map((s) => {
    const p = bol(s)
    return {
      ad: p[0] || '',
      birim: (p[3] || 'adet').toLowerCase(),
      eski: oku(p[4] || ''),
      fiyat: oku(p[1] || ''),
      miktar: oku(p[2] || ''),
      yer: p[5] || '',
    }
  })

/** Birim fiyat: satış fiyatı ÷ net miktar, kg/L/adet cinsinden. */
const birimFiyat = (s) => {
  const o = OLCEK[s.birim]
  if (!o || s.fiyat == null || !s.miktar) return null
  const net = s.miktar * o.carpan
  if (net <= 0) return null
  return { birim: o.goster, deger: s.fiyat / net }
}

const indirimYuzde = (s) =>
  s.eski && s.fiyat != null && s.eski > s.fiyat
    ? Math.round(((s.eski - s.fiyat) / s.eski) * 100)
    : null

/* ---------- CSV ----------
   Neden CSV, neden .xlsx değil: Excel .csv'yi çift tıkla açıyor, kullanıcı
   açısından fark yok. .xlsx ise ZIP açıp XML okuyan yabancı bir kütüphane
   demek — bu araç "veri tarayıcıdan çıkmıyor" sözü üzerine kurulu, oraya bir
   ayrıştırıcı sokmak hem paketi büyütür hem saldırı yüzeyi açar. */

/**
 * CSV ENJEKSİYONU koruması.
 *
 * `=`, `+`, `-`, `@` ile başlayan hücreyi Excel ve LibreOffice FORMÜL sayıyor.
 * Dışa aktarılan dosya başkasına gidebiliyor; `=cmd|' /c calc'!A1` gibi bir
 * ürün adı karşı tarafta çalışabilir. Tek tırnak öneki hücreyi metne
 * kilitliyor ve Excel onu göstermiyor; okurken geri alınıyor.
 */
const hucre = (x) => {
  const ham = String(x ?? '')
  const tehlikeli = /^[=+\-@\t\r]/.test(ham)
  const deger = tehlikeli ? `'${ham}` : ham
  return /[",\n\r]/.test(deger) ? `"${deger.replace(/"/g, '""')}"` : deger
}

const csvYaz = (basliklar, satirlar) =>
  [basliklar, ...satirlar].map((s) => s.map(hucre).join(',')).join('\r\n')

/**
 * CSV'yi satır/sütun dizisine çevirir.
 *
 * Tırnak içindeki virgül ve satır sonu ayraç DEĞİL — karakter karakter
 * okumanın sebebi bu. `split(',')` tırnaklı bir açıklamayı ikiye bölerdi.
 */
const csvOku = (metin) => {
  const satirlar = []
  let satir = []
  let hucreIci = ''
  let tirnakta = false
  const s = metin.replace(/^﻿/, '')
  for (let i = 0; i < s.length; i++) {
    const c = s[i]
    if (tirnakta) {
      if (c === '"') {
        if (s[i + 1] === '"') { hucreIci += '"'; i++ } else tirnakta = false
      } else hucreIci += c
      continue
    }
    if (c === '"') { tirnakta = true; continue }
    if (c === ',' || c === ';' || c === '\t') { satir.push(hucreIci); hucreIci = ''; continue }
    if (c === '\n') {
      satir.push(hucreIci); hucreIci = ''
      if (satir.some((x) => x.trim())) satirlar.push(satir)
      satir = []
      continue
    }
    if (c === '\r') continue
    hucreIci += c
  }
  satir.push(hucreIci)
  if (satir.some((x) => x.trim())) satirlar.push(satir)
  // Dışa aktarırken koyduğumuz tek tırnak öneki geri alınıyor.
  return satirlar.map((r) => r.map((x) => x.replace(/^'/, '').trim()))
}

/** Tarayıcıda indirme. Sunucuya hiçbir şey gitmiyor. */
const csvIndir = (ad, icerik) => {
  // BOM: Excel Türkçe karakterleri UTF-8 olarak ancak bununla tanıyor,
  // yoksa "Zeytinyağı" -> "ZeytinyaÄŸÄ±" oluyor.
  const b = new Blob(['﻿' + icerik], { type: 'text/csv;charset=utf-8' })
  const u = URL.createObjectURL(b)
  const a = document.createElement('a')
  a.download = ad
  a.href = u
  a.click()
  URL.revokeObjectURL(u)
}

    console.log('gecti', ad, a)
  }
  // Boş dizgi tuzağı: Number('') sıfır, isFinite(0) doğru.

  esit(oku('145,90'), 145.9, 'virgüllü ondalık')
  esit(oku('abc'), null, 'sayı olmayan null')
  // Birim fiyat: 500 g / 180 ₺ -> 360 ₺/kg
  esit(birimFiyat({ birim: 'g', fiyat: 180, miktar: 500 }), { birim: 'kg', deger: 360 }, 'gram kiloya çevriliyor')
  esit(birimFiyat({ birim: 'ml', fiyat: 240, miktar: 500 }), { birim: 'L', deger: 480 }, 'mililitre litreye çevriliyor')
  esit(birimFiyat({ birim: 'adet', fiyat: 12, miktar: 3 }), { birim: 'adet', deger: 4 }, 'adet birim fiyatı')
  esit(birimFiyat({ birim: 'g', fiyat: 180, miktar: 0 }), null, 'sıfır miktarda hesap yok')
  esit(birimFiyat({ birim: 'kutu', fiyat: 10, miktar: 1 }), null, 'bilinmeyen birim')
  esit(indirimYuzde({ eski: 280, fiyat: 240 }), 14, 'indirim yüzdesi')
  esit(indirimYuzde({ eski: 200, fiyat: 240 }), null, 'zam indirim değil')
  // CSV ENJEKSİYONU: formül olabilecek hücre tek tırnakla kilitleniyor.
  // Asıl güvenlik özelliği ÖNEK: hücre tek tırnakla başlıyorsa Excel onu
  // formül değil metin sayıyor. Tırnakla sarmalama ayrı bir mesele (virgül,
  // çift tırnak, satır sonu varsa gerekiyor) ve burada gerekmiyor.
  const kilitli = (x) => csvYaz(['ad'], [[x]]).split('\r\n')[1].startsWith("'")
  esit(kilitli('=cmd|\' /c calc\'!A1'), true, 'formül hücresi kilitlendi')
  esit(kilitli('@SUM(1)'), true, 'at işaretli hücre kilitlendi')
  esit(kilitli('-5'), true, 'eksiyle başlayan hücre kilitlendi')
  esit(kilitli('+1'), true, 'artıyla başlayan hücre kilitlendi')
  esit(kilitli('Zeytinyağı'), false, 'zararsız hücreye dokunulmuyor')
  esit(csvYaz(['ad'], [['Zeytinyağı']]), 'ad\r\nZeytinyağı', 'zararsız hücre olduğu gibi')
  esit(csvYaz(['ad'], [['a,b']]), 'ad\r\n"a,b"', 'virgüllü hücre tırnaklanıyor')
  // Gidiş-dönüş: yazılan CSV geri okunduğunda aynı veri çıkmalı.
  const veri = [['Zeytinyağı 1 L', '240', '1', 'L', '280', 'Ayvalık'], ['=zararlı', '5', '1', 'adet', '', '']]
  esit(csvOku(csvYaz(['a', 'b', 'c', 'd', 'e', 'f'], veri)).slice(1), veri, 'CSV gidiş-dönüş')
  esit(csvOku('﻿ad,fiyat\r\nÇay,20')[0], ['ad', 'fiyat'], 'BOM ayrıştırmada yutuluyor')
  // Ayraç seçimi
  esit(ayikla('Çay\t20\t100\tg')[0].fiyat, 20, 'sekme ayracı')
  esit(ayikla('Çay,20,100,g')[0].miktar, 100, 'virgül ayracı')
  // Kontrast: WCAG referans değerleri.
  esit(Math.round(kontrast('#ffffff', '#000000')), 21, 'siyah-beyaz 21:1')
  esit(kontrast('#ffffff', '#ffffff'), 1, 'aynı renk 1:1')
  esit(kontrast('#zzzzzz', '#000000'), 0, 'geçersiz renk kapıyı kapatıyor')
  esit(hexOku('#fff'), [255, 255, 255], 'kısa hex okunuyor')
  // Mürekkep seçimi: eşik değil ölçüm. Sarı ve beyaz siyah yazı, koyu
  // kırmızı ve yeşil beyaz yazı istiyor.
  esit(murekkep('#ffffff'), SIYAH, 'beyaz zeminde siyah yazı')
  esit(murekkep('#ffe200'), SIYAH, 'sarı zeminde siyah yazı')
  esit(murekkep('#d81f26'), BEYAZ, 'kırmızı zeminde beyaz yazı')
  esit(murekkep('#0f6b2f'), BEYAZ, 'yeşil zeminde beyaz yazı')
  esit(murekkep('#000000'), BEYAZ, 'siyah zeminde beyaz yazı')
  // Seçilebilir her zeminde yazı WCAG AA eşiğini (4,5) geçmeli.
  RENKLER.filter((r) => r !== 'ozel').forEach((z) =>
    esit(kontrast(z, murekkep(z)) >= 4.5, true, z + ' zemininde AA kontrast'))
  /* Asıl garanti: KULLANICI NE SEÇERSE SEÇSİN mürekkep AA'yı tutuyor. Siyah ve
     beyaz kontrast eğrileri L≈0,179'da kesişiyor ve orada bile oran 4,58.
     Gri ekseni ve doymuş renkleri tarayıp en kötü durumu ölçüyoruz. */
  let enKotu = 21
  for (let v = 0; v <= 255; v += 3) {
    const griler = [[v, v, v], [v, 0, 0], [0, v, 0], [0, 0, v], [v, v, 0], [0, v, v], [v, 0, v]]
    for (const [r, g, b] of griler) {
      const z = '#' + [r, g, b].map((x) => x.toString(16).padStart(2, '0')).join('')
      enKotu = Math.min(enKotu, kontrast(z, murekkep(z)))
    }
  }
  esit(enKotu >= 4.5, true, 'her zeminde AA garantili (en kötü ' + enKotu.toFixed(2) + ')')
  // Rozet: kırmızı korunabiliyorsa korunuyor, kırmızı zeminde kayboluyorsa dönüyor.
  esit(rozetRenk('#ffffff').zemin, '#c0182b', 'beyaz zeminde rozet kırmızı kalıyor')
  esit(rozetRenk('#ffe200').zemin, '#c0182b', 'sarı zeminde rozet kırmızı kalıyor')
  esit(rozetRenk('#d81f26').zemin, '#ffffff', 'kırmızı zeminde rozet mürekkebe dönüyor')
  esit(kontrast(rozetRenk('#d81f26').zemin, rozetRenk('#d81f26').yazi) >= 3, true,
       'dönen rozet de okunuyor')
  esit(dilCoz('de'), 'de', 'bilinen dil')
  esit(dilCoz('fr'), 'tr', 'bilinmeyen dil Türkçeye düşüyor')
  const anahtar = Object.keys(METIN.tr).sort()
  DILLER.forEach((d) => {
    esit(Object.keys(METIN[d]).sort(), anahtar, d + ' anahtarları tam')
    esit(METIN[d].duzenler.length, DUZENLER.length, d + ' düzen adları tam')
    esit(METIN[d].csvBasliklar.length, 6, d + ' CSV başlıkları tam')
    esit(METIN[d].renkler.length, RENKLER.length, d + ' renk adları tam')
  })
  // BOM bayt düzeyinde: EF BB BF olmadan Excel UTF-8'i tanımıyor ve
  // "Zeytinyağı" -> "ZeytinyaÄŸÄ±" oluyor. Blob'u okuyup ilk üç baytı ölçüyoruz.
  const bayt = new Uint8Array(await new Blob(['\ufeff' + 'ad\r\nZeytinyağı'],
    { type: 'text/csv;charset=utf-8' }).arrayBuffer())
  esit([bayt[0], bayt[1], bayt[2]], [0xEF, 0xBB, 0xBF], 'CSV çıktısı BOM ile başlıyor')
  console.log('tüm sınamalar geçti')
})()

/* ---------- arayüz ---------- */
const $ = (id) => document.getElementById(id)
const ham = $('ham'), kutu = $('kutu')
let dil = dilCoz(new URLSearchParams(location.search).get('dil') || navigator.language?.slice(0, 2))
let hepsiniGoster = false
let hamDokunuldu = false
let kirli = false
const t = () => METIN[dil]
const para = (n) => n.toLocaleString(YORE[dil], { maximumFractionDigits: 2, minimumFractionDigits: 2 })
const olcu = (n) => n.toLocaleString(YORE[dil])

const ORNEK =
  'Zeytinyağı 1 L\t240\t1\tL\t280\tAyvalık\n' +
  'Beyaz peynir\t180\t500\tg\t\tTrakya\n' +
  'Türk kahvesi 100 g\t45\t100\tg\t\tİzmir'

$('duzen').innerHTML = DUZENLER.map((d) => `<option value="${d}"></option>`).join('')
$('tabaka').innerHTML = TABAKA.map((_, i) => `<option value="${i}"></option>`).join('')
$('renk').innerHTML = RENKLER.map((r, i) => `<option value="${i}"></option>`).join('')

DILLER.forEach((d) => {
  const b = document.createElement('button')
  b.type = 'button'; b.textContent = DIL_ADI[d]; b.lang = d
  b.onclick = () => { dil = d; uygulaDil(); ciz() }
  $('diller').append(b)
})

/* Kaydedilmemiş değişiklik uyarısı.
   Bin ürün girip sekmeyi kapatan kullanıcı her şeyi kaybediyordu — veri
   tarayıcıdan çıkmıyor, yani kurtaracak bir sunucu kopyası da yok. Tarayıcı
   kendi metnini gösteriyor, bizimki yok sayılıyor; yine de returnValue yazmak
   ŞART, yoksa uyarı hiç çıkmıyor. */
window.addEventListener('beforeunload', (e) => {
  if (!kirli) return
  e.preventDefault()
  e.returnValue = ''
})

function uygulaDil() {
  const m = t()
  document.documentElement.lang = dil
  document.documentElement.dir = RTL.includes(dil) ? 'rtl' : 'ltr'
  document.title = m.baslik
  document.querySelector('meta[name=description]').content = m.aciklama
  document.querySelectorAll('[data-t]').forEach((e) => { e.textContent = m[e.dataset.t] })
  // Girdi anlatımında kalın yazılmış sütun adları var, o yüzden innerHTML.
  $('girdiAnlat').innerHTML = m.girdiAnlat
  if (!hamDokunuldu) ham.value = ORNEK
  $('duzen').querySelectorAll('option').forEach((o, i) => { o.textContent = m.duzenler[i] })
  $('tabaka').querySelectorAll('option').forEach((o, i) => {
    const x = TABAKA[i]
    o.textContent = doldur(m.tabakaAd, { g: olcu(x.g), y: olcu(x.y), n: x.sutun * x.satir })
  })
  $('renk').querySelectorAll('option').forEach((o, i) => { o.textContent = m.renkler[i] })
  $('diller').querySelectorAll('button')
    .forEach((b, i) => b.setAttribute('aria-pressed', String(DILLER[i] === dil)))

  const bag = (yol, yazi) => `<a href="https://hanzala.com.tr${yol}">${yazi}</a>`
  document.querySelector('footer').innerHTML = m.altbilgi
    .replace('{site}', bag('', m.altSite))
    .replace('{araclar}', bag('/araclar', m.altAraclar))

  const u = new URL(location.href)
  dil === 'tr' ? u.searchParams.delete('dil') : u.searchParams.set('dil', dil)
  history.replaceState(null, '', u)
}

/** Seçili zemin: hazır renklerden biri ya da özel seçicinin değeri. */
function zeminSec() {
  const i = Number($('renk').value) || 0
  const r = RENKLER[i]
  const ozel = r === 'ozel'
  $('renkOzel').hidden = !ozel
  return ozel ? $('renkOzel').value : r
}

function ciz() {
  const m = t()
  const duzen = $('duzen').value
  const tabaka = TABAKA[Number($('tabaka').value) || 0]
  const birimGoster = $('birimGoster').checked
  const yerGoster = $('yerGoster').checked
  const tarih = $('tarih').value
  const satirlar = ayikla(ham.value)

  /* Zorunlu alan denetimi. Araç etiketi yine de basıyor — eksik bilgiyle
     baskıyı engellemek işletmeyi çıkmaza sokar; uyarıp bırakmak doğrusu. */
  const eksikler = satirlar.map((s) => {
    const e = []
    if (!s.ad) e.push(m.eksikAd)
    if (s.fiyat == null) e.push(m.eksikFiyat)
    if (birimGoster && !birimFiyat(s)) e.push(m.eksikBirim)
    if (yerGoster && !s.yer) e.push(m.eksikYer)
    return e.length ? { ad: s.ad || m.adsiz, e } : null
  }).filter(Boolean)

  const kac = (x) => String(x).replace(/</g, '&lt;')
  $('eksikler').hidden = !eksikler.length
  $('eksikler').innerHTML = eksikler.slice(0, 6)
    .map((x) => `<li>${kac(x.ad)}: ${x.e.join(', ')}</li>`).join('')

  const kirpildi = Math.max(0, satirlar.length - TAVAN)
  const etiketler = satirlar.slice(0, TAVAN)
  $('kirpma').hidden = !kirpildi
  $('kirpma').textContent = kirpildi ? doldur(m.kirpma, { tavan: TAVAN, kalan: kirpildi }) : ''

  $('sayac').textContent = doldur(m.sayac, { n: etiketler.length })
  $('hepsi').hidden = etiketler.length <= ONIZLEME
  $('hepsi').textContent = hepsiniGoster
    ? doldur(m.ilkGoster, { n: ONIZLEME })
    : doldur(m.hepsiniGoster, { n: etiketler.length })
  $('yazdir').disabled = !etiketler.length
  $('disaAktar').disabled = !satirlar.length
  $('onizlemeNot').hidden = !(etiketler.length > ONIZLEME && !hepsiniGoster)
  $('onizlemeNot').textContent = doldur(m.onizlemeNot, { o: ONIZLEME, n: etiketler.length })

  const zemin = zeminSec()
  const ink = murekkep(zemin)
  const rozet = rozetRenk(zemin)
  const oran = kontrast(zemin, ink)
  /* Eşik 7, 4,5 değil. Siyah/beyaz mürekkep seçimi kontrastı zaten 4,58'in
     altına düşüremiyor (iki eğrinin kesiştiği yer L≈0,179), yani AA eşiğine
     bağlı bir uyarı hiç çalışmayan ölü koddu. Rafta bir metre uzaktan,
     değişken market ışığında okunan bir etiket için anlamlı ayrım 7:1. */
  const yeterli = oran >= 7
  $('kontrastNot').textContent = doldur(m.kontrastNot, {
    oran: oran.toFixed(2).replace('.', dil === 'en' ? '.' : ','),
    durum: yeterli ? m.kontrastIyi : m.kontrastDusuk,
  })
  $('kontrastNot').dataset.dusuk = yeterli ? '0' : '1'

  kutu.style.setProperty('--et-zemin', zemin)
  kutu.style.setProperty('--et-murekkep', ink)
  kutu.style.setProperty('--et-rozet', rozet.zemin)
  kutu.style.setProperty('--et-rozet-yazi', rozet.yazi)
  kutu.style.setProperty('--et-en', tabaka.g + 'mm')
  kutu.style.setProperty('--et-boy', tabaka.y + 'mm')
  kutu.style.setProperty('--et-sutun', String(tabaka.sutun))

  const gorunen = hepsiniGoster ? etiketler : etiketler.slice(0, ONIZLEME)
  kutu.replaceChildren(...gorunen.map((s) => {
    const el = document.createElement('div')
    el.className = 'raf-etiket'
    el.dataset.duzen = duzen
    const bf = birimGoster ? birimFiyat(s) : null
    const yuzde = indirimYuzde(s)
    const alt = [yerGoster && s.yer ? s.yer : '', tarih || ''].filter(Boolean).join(' · ')
    el.innerHTML =
      `<span class="raf-etiket__ad">${kac(s.ad)}</span>` +
      (duzen === 'indirim' && s.eski != null ? `<span class="raf-etiket__eski">${para(s.eski)} ₺</span>` : '') +
      `<span class="raf-etiket__fiyat">${s.fiyat == null ? '—' : para(s.fiyat) + ' ₺'}</span>` +
      (duzen === 'indirim' && yuzde != null ? `<span class="raf-etiket__yuzde">%${yuzde}</span>` : '') +
      (bf ? `<span class="raf-etiket__birim">${para(bf.deger)} ₺/${bf.birim}</span>` : '') +
      `<span class="raf-etiket__alt">${kac(alt)}</span>`
    return el
  }))
}

$('disaAktar').onclick = () => {
  const satirlar = ayikla(ham.value)
  csvIndir('raf-etiketleri.csv', csvYaz([...t().csvBasliklar], satirlar.map((x) => [
    x.ad,
    x.fiyat == null ? '' : String(x.fiyat).replace('.', ','),
    x.miktar == null ? '' : String(x.miktar).replace('.', ','),
    x.birim,
    x.eski == null ? '' : String(x.eski).replace('.', ','),
    x.yer,
  ])))
  kirli = false
}
$('iceAktar').onclick = () => $('dosya').click()
$('dosya').onchange = async (e) => {
  const f = e.target.files?.[0]
  if (!f) return
  const tablo = csvOku(await f.text())
  /* Başlık satırı varsa atlanıyor: ikinci sütun sayıya çevrilemiyorsa o satır
     başlıktır. */
  const govde = tablo.length > 1 && oku(tablo[0][1] ?? '') == null ? tablo.slice(1) : tablo
  ham.value = govde.map((r) => r.join('\t')).join('\n')
  hamDokunuldu = true
  kirli = true
  e.target.value = ''
  ciz()
}
$('hepsi').onclick = () => { hepsiniGoster = !hepsiniGoster; ciz() }
$('yazdir').onclick = () => window.print()
ham.addEventListener('input', () => { hamDokunuldu = true; kirli = true })
document.querySelectorAll('#ham, #duzen, #tabaka, #tarih, #birimGoster, #yerGoster, #renk, #renkOzel')
  .forEach((e) => e.addEventListener('input', ciz))

uygulaDil()
ciz()
</script>
